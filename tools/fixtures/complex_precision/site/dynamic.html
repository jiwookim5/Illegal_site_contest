<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주민 게시판</title><link rel="stylesheet" href="/site.css"></head><body>
<header><a href="/">누리시 시민정보 포털</a></header><main><h1>시민 디지털 안전 수업 후기</h1>
<article><h2>수업 참여 후기</h2><p id="n-comment">카 지 노 광고를 차단하는 방법을 배웠습니다. 사기 예방 수업에 감사드립니다.</p></article>
<section><h2>추가 댓글</h2><button id="more" type="button">댓글 더보기</button><div id="comments"></div></section>
<section><h2>늦게 도착하는 기관 알림</h2><div id="delayed"></div></section>
<section><h2>접어 둔 신청 안내</h2><details><summary>상담 일정 자세히</summary><p id="n-dynamic-details">도박 중독 예방 무료 상담은 화요일과 목요일에 진행합니다.</p></details></section>
<section><h2>알림 보기</h2><button id="open-dialog" type="button">자세히 보기</button><dialog id="notice"><h2>피해 지원 안내</h2><p id="n-dialog">카지노 피해자 무료 상담 안내입니다.</p><p>상담 후 필요한 지역 복지 서비스를 연결합니다.</p><button id="close-dialog" type="button">닫기</button></dialog></section>
</main><script>
document.getElementById('more').onclick = async function () {
  if (this.disabled) return;
  this.disabled = true;
  const response = await fetch('/comments.json');
  const items = await response.json();
  for (const item of items) {
    const article = document.createElement('article');
    const h3 = document.createElement('h3'); h3.textContent = item.heading;
    const p = document.createElement('p'); p.id = item.id; p.textContent = item.text;
    article.append(h3, p); document.getElementById('comments').append(article);
  }
};
setTimeout(() => {
  const p = document.createElement('p'); p.id = 'n-delayed';
  p.textContent = '사기 예방 공지: 카.지.노 가입 혜택 메시지를 삭제하세요.';
  document.getElementById('delayed').append(p);
}, 600);
document.getElementById('open-dialog').onclick = () => document.getElementById('notice').showModal();
document.getElementById('close-dialog').onclick = () => document.getElementById('notice').close();
</script></body></html>
