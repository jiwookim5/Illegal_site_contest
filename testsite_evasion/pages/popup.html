<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팝업 사례</title>
<style>
body{margin:0;background:#fff;color:#222;font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-size:15px;line-height:1.6}
.top{background:#1a3c6e;color:#fff;padding:10px 20px;font-weight:bold}
.wrap{max-width:900px;margin:20px auto;padding:0 16px}
h2{border-bottom:2px solid #1a3c6e;padding-bottom:8px}
.case{border:1px solid #d9e2ec;border-radius:4px;padding:10px 14px;margin:10px 0;position:relative}
.case h3{margin:0 0 6px;font-size:13px;color:#64748b;font-weight:normal}
.layer-before::before{content:'';position:absolute;inset:0;background:#fff}
ul.menu{list-style:none;padding:0}
ul.menu li{padding:6px 0;border-bottom:1px dashed #e2e8f0}
</style>
</head>
<body>
<div class="top">훤히시 열린행정</div>
<div class="wrap">
<h2>팝업 사례</h2>
<p>본문입니다. <button type="button" onclick="document.querySelector('.pp-01').style.display='block'">이벤트 보기</button></p>
<div class="pp-01" style="display:none;position:fixed;top:20%;left:20%;background:#fff;border:1px solid #333;padding:20px">안전놀이터 먹튀검증 첫충 30% 지급 텔레그램 @ev_pp01</div>
<div class="ppok-01" style="display:none;position:fixed;top:20%;left:20%;background:#fff;border:1px solid #333;padding:20px">청사 이전 안내: 11월 1일부터 신청사에서 민원을 접수합니다. <label><input type="checkbox"> 오늘 하루 보지 않기</label></div>
<dialog class="pp-02">안전놀이터 먹튀검증 첫충 30% 지급 텔레그램 @ev_pp02</dialog>
<dialog class="ppok-02">개인정보 처리방침이 변경되었습니다. 자세한 내용은 하단 링크를 확인해 주세요.</dialog>
</div>
</body>
</html>
